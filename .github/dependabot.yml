---
version: 2
updates:

  # Maintain npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    groups:
      dev-deps:
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "@docusaurus/*"
          - "react*"
          - "@testing-library/react"
          - "@mdx-js/react"
      docusaurus:
        patterns:
          - "@docusaurus/*"
      react:
        patterns:
          - "react*"
          - "@testing-library/react"
          - "@mdx-js/react"
      prod-minor-patch:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gh-aws-actions:
        patterns:
          - "actions/*"
          - "aws-actions/*"
          - "github/*"
      docker:
        patterns:
          - "docker/*"
      gha-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"
    labels:
      - "bot"
    commit-message:
      prefix: "[CHORE](deps)"
      include: "scope"
    cooldown:
      default-days: 7
