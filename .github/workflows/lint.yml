---
name: Lint

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: MegaLinter
    runs-on: ubuntu-latest
    permissions:
      issues: write # for MegaLinter to create issue annotations
      pull-requests: write # for MegaLinter PR summary comments
      statuses: write # for MegaLinter commit status updates
    steps:
      - name: Checkout Repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Required for MegaLinter to detect changed files
          fetch-depth: 0
          persist-credentials: false

      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/javascript@9949bad031045f366be2467e00e8371a7328a2e2 # v10.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_ALL_CODEBASE: true
          # Enable only Markdown (markdownlint), SQL (sqlfluff), and
          # JavaScript (ESLint). Listing linters in ENABLE_LINTERS causes
          # all other linters to default to disabled.
          ENABLE_LINTERS: MARKDOWN_MARKDOWNLINT,SQL_SQLFLUFF,JAVASCRIPT_ES
          # Repo's markdownlint config predates MegaLinter's default filename.
          MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdown-lint.yml
          # Repo's eslint.config.mjs imports packages (@eslint/js,
          # eslint-plugin-react, etc.) not bundled in MegaLinter's own
          # node_modules, so install the project's deps and run its local
          # eslint binary instead (see megalinter.io/latest/descriptors/javascript_eslint).
          JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
          JAVASCRIPT_ES_FILE_EXTENSIONS: '[".js", ".jsx"]'
          JAVASCRIPT_ES_PRE_COMMANDS: >-
            [{"command": "npm ci", "cwd": "workspace", "continue_if_failed": false}]
          # eslint's own bin symlink didn't materialize after npm ci in
          # testing (FileNotFoundError even with an absolute path), so
          # invoke its JS entrypoint directly through node instead of
          # relying on node_modules/.bin/eslint existing.
          JAVASCRIPT_ES_CLI_EXECUTABLE: '["node", "/github/workspace/node_modules/eslint/bin/eslint.js"]'
